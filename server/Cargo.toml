[package]
name = "veille_emploi"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
csv = "1.4.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
